[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "football-exact-score-intelligence"
version = "0.1.0"
description = "Telegram-first football exact-score analytics scaffold"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.5,<3",
  "numpy>=2.0,<3",
  "scipy>=1.13,<2",
  "httpx>=0.27,<1",
  "python-telegram-bot[job-queue]>=21,<23"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<2", "pytest-cov>=5,<7", "ruff>=0.6,<1", "mypy>=1.11,<2"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501", "E701", "E702"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]
